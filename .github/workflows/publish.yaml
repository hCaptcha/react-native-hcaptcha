name: Publish
on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: npm install
      - run: npm test
      - run: npm run lint

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: npm release
        run: |
          npm ci
          npm publish --no-git-checks --access public
